<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صلاتي - مواقيت الصلاة والمساجد</title>
    
    <!-- مكتبات الخرائط Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .buttons-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        #btn-prayer {
            background-color: #3498db;
            color: white;
        }

        #btn-map {
            background-color: #2ecc71;
            color: white;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* قسم مواقيت الصلاة */
        #prayer-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        .times-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .time-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .time-card h3 {
            color: #e67e22;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .time-card p {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            direction: ltr;
        }

        /* قسم الخريطة */
        #map-section {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s;
        }

        #map {
            height: 450px;
            width: 100%;
            border-radius: 10px;
            border: 2px solid #ddd;
            z-index: 1;
        }

        #status-message {
            margin-bottom: 10px;
            font-weight: bold;
            color: #e74c3c;
        }

        /* إخفاء تعليمات المسار النصية من الخريطة للحفاظ على الشكل الجمالي */
        .leaflet-routing-container {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body style="display: none;"> <!-- إخفاء المحتوى مؤقتاً لحين التحقق من تسجيل الدخول -->

    <div class="container">
        <h1>مواقيت الصلاة والمساجد القريبة</h1>
        
        <div class="buttons-group">
            <button id="btn-prayer" onclick="showSection('prayer')">مواقيت الصلاة</button>
            <button id="btn-map" onclick="showSection('map')">صلاتي (المساجد)</button>
        </div>

        <!-- قسم مواقيت الصلاة -->
        <div id="prayer-section">
            <select id="city-select" onchange="getPrayerTimes()">
                <option value="" disabled selected>اختر محافظتك...</option>
                <option value="Cairo">القاهرة</option>
                <option value="Alexandria">الإسكندرية</option>
                <option value="Giza">الجيزة</option>
                <option value="Dakahlia">الدقهلية</option>
                <option value="Red Sea">البحر الأحمر</option>
                <option value="Beheira">البحيرة</option>
                <option value="Fayoum">الفيوم</option>
                <option value="Gharbia">الغربية</option>
                <option value="Ismailia">الإسماعيلية</option>
                <option value="Menofia">المنوفية</option>
                <option value="Minya">المنيا</option>
                <option value="Qalyubia">القليوبية</option>
                <option value="New Valley">الوادي الجديد</option>
                <option value="Suez">السويس</option>
                <option value="Aswan">أسوان</option>
                <option value="Assiut">أسيوط</option>
                <option value="Beni Suef">بني سويف</option>
                <option value="Port Said">بورسعيد</option>
                <option value="Damietta">دمياط</option>
                <option value="Sharkia">الشرقية</option>
                <option value="South Sinai">جنوب سيناء</option>
                <option value="Kafr El Sheikh">كفر الشيخ</option>
                <option value="Matrouh">مطروح</option>
                <option value="Luxor">الأقصر</option>
                <option value="Qena">قنا</option>
                <option value="North Sinai">شمال سيناء</option>
                <option value="Sohag">سوهاج</option>
            </select>

            <div class="times-grid" id="times-container">
                <!-- سيتم حقن المواقيت هنا -->
            </div>
        </div>

        <!-- قسم خريطة المساجد -->
        <div id="map-section">
            <div id="status-message"></div>
            <div id="map"></div>
        </div>
    </div>

    <!-- استدعاء ملفات الجافاسكريبت للخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- ===== Firebase ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // =============================================================
        // ===== تهيئة Firebase والتحقق من تسجيل الدخول (Auth Guard) =====
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC9uyTILCMVlCeNNuVJvDjrQJ25bP3IHKA",
            authDomain: "muslim-30567.firebaseapp.com",
            projectId: "muslim-30567",
            appId: "1:477829492310:web:aa139ac9360fd9232a15f7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        auth.onAuthStateChanged((user) => {
            if (user) {
                // المستخدم مسجل دخول -> إظهار الصفحة (نرجعها flex زي ما كانت في الـ CSS)
                document.body.style.display = 'flex';
            } else {
                // المستخدم غير مسجل دخول -> توجيه للصفحة الرئيسية
                window.location.replace('index.html'); 
            }
        });

        // المتغيرات العامة للخريطة
        let map;
        let userMarker;
        let routingControl = null;
        let userLat, userLng;

        // دالة التنقل بين الأقسام
        function showSection(section) {
            document.getElementById('prayer-section').style.display = section === 'prayer' ? 'block' : 'none';
            document.getElementById('map-section').style.display = section === 'map' ? 'block' : 'none';
            
            if (section === 'map') {
                initMap();
            }
        }

        // ==========================================
        // 1. نظام مواقيت الصلاة
        // ==========================================
        async function getPrayerTimes() {
            const city = document.getElementById('city-select').value;
            if (!city) return;

            const container = document.getElementById('times-container');
            container.innerHTML = '<p>جاري تحميل المواقيت...</p>';

            try {
                // الهيئة المصرية العامة للمساحة (method=5)
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Egypt&method=5`);
                const data = await response.json();
                
                if (data.code === 200) {
                    const timings = data.data.timings;
                    
                    // تحويل نظام 24 ساعة إلى 12 ساعة
                    const formatTime = (time24) => {
                        let [hours, minutes] = time24.split(':');
                        hours = parseInt(hours);
                        let ampm = hours >= 12 ? 'م' : 'ص';
                        hours = hours % 12 || 12;
                        return `${hours}:${minutes} ${ampm}`;
                    };

                    container.innerHTML = `
                        <div class="time-card"><h3>الفجر</h3><p>${formatTime(timings.Fajr)}</p></div>
                        <div class="time-card"><h3>الظهر</h3><p>${formatTime(timings.Dhuhr)}</p></div>
                        <div class="time-card"><h3>العصر</h3><p>${formatTime(timings.Asr)}</p></div>
                        <div class="time-card"><h3>المغرب</h3><p>${formatTime(timings.Maghrib)}</p></div>
                        <div class="time-card"><h3>العشاء</h3><p>${formatTime(timings.Isha)}</p></div>
                    `;
                }
            } catch (error) {
                container.innerHTML = '<p style="color:red;">حدث خطأ في جلب المواقيت. تأكد من اتصالك بالإنترنت.</p>';
            }
        }

        // ==========================================
        // 2. نظام الخرائط والمساجد القريبة
        // ==========================================
        function initMap() {
            const statusMsg = document.getElementById('status-message');
            
            if (!map) {
                statusMsg.innerText = "جاري طلب صلاحية الموقع للبحث عن أقرب المساجد...";
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            userLat = position.coords.latitude;
                            userLng = position.coords.longitude;
                            
                            // تهيئة الخريطة
                            map = L.map('map').setView([userLat, userLng], 15);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '© OpenStreetMap contributors'
                            }).addTo(map);

                            // وضع علامة المستخدم
                            const userIcon = L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34],
                                shadowSize: [41, 41]
                            });
                            
                            userMarker = L.marker([userLat, userLng], {icon: userIcon})
                                .addTo(map)
                                .bindPopup("<b>موقعك الحالي</b>").openPopup();

                            // البحث عن المساجد
                            findNearbyMosques(userLat, userLng);
                        },
                        (error) => {
                            statusMsg.innerText = "تم رفض صلاحية الموقع أو حدث خطأ. برجاء تفعيل الـ GPS.";
                        }
                    );
                } else {
                    statusMsg.innerText = "متصفحك لا يدعم خاصية تحديد الموقع.";
                }
            }
        }

        async function findNearbyMosques(lat, lng) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.innerText = "جاري البحث عن المساجد في نطاق 1 كيلو متر...";

            // قللنا النطاق لـ 1000 متر (1 كيلو) وضفنا timeout 15 ثانية عشان السيرفر ميفصلش
            const radius = 1000;
            const query = `[out:json][timeout:15];(node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lng});way["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lng}););out center;`;
            
            // قايمة بـ 3 سيرفرات مجانية مختلفة لو واحد فشل التاني يشتغل
            const servers = [
                `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`,
                `https://lz4.overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`,
                `https://z.overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`
            ];

            let isSuccess = false;

            for (let url of servers) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue; // لو السيرفر ده مشغول، روح للي بعده فوراً
                    
                    const data = await response.json();

                    if (data.elements && data.elements.length > 0) {
                        statusMsg.innerText = `تم العثور على ${data.elements.length} مسجد قريب. اضغط على المسجد لرسم المسار.`;
                        
                        const mosqueIcon = L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        });

                        data.elements.forEach(element => {
                            const mLat = element.lat || element.center.lat;
                            const mLng = element.lon || element.center.lon;
                            let name = element.tags.name || "مسجد (بدون اسم)";

                            const marker = L.marker([mLat, mLng], {icon: mosqueIcon}).addTo(map);
                            marker.bindPopup(`<b>${name}</b><br><button onclick="routeToMosque(${mLat}, ${mLng})" style="margin-top:5px; padding:5px 10px; font-size:12px; width:100%; cursor:pointer; background-color:#3498db; color:white; border:none; border-radius:5px;">ارسم الطريق</button>`);
                        });
                        isSuccess = true;
                        break; // لو نجح وجاب المساجد، يخرج من اللوب وميكلمش باقي السيرفرات
                    } else {
                        statusMsg.innerText = "لم يتم العثور على مساجد مسجلة على الخريطة في هذا النطاق.";
                        isSuccess = true;
                        break;
                    }
                } catch (error) {
                    console.log("سيرفر فشل، جاري تجربة سيرفر بديل...");
                }
            }

            // لو التلات سيرفرات فشلوا (وده نادر جداً)
            if (!isSuccess) {
                statusMsg.innerText = "السيرفرات العالمية عليها ضغط حالياً. يرجى المحاولة بعد قليل.";
            }
        }

        // دالة رسم المسار للمسجد المختار
        function routeToMosque(destLat, destLng) {
            // إغلاق أي نافذة مفتوحة على الخريطة
            map.closePopup();
            
            // حذف المسار القديم إذا كان موجوداً
            if (routingControl != null) {
                map.removeControl(routingControl);
            }

            // رسم المسار الجديد باستخدام Leaflet Routing Machine
            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userLat, userLng),
                    L.latLng(destLat, destLng)
                ],
                routeWhileDragging: false,
                addWaypoints: false,
                createMarker: function() { return null; }, // منع إنشاء علامات إضافية
                lineOptions: {
                    styles: [{color: '#e67e22', opacity: 0.8, weight: 6}]
                }
            }).addTo(map);
            
            document.getElementById('status-message').innerText = "تم رسم مسار الطريق للمسجد المختار.";
        }
    </script>
</body>
</html>
