  <style>
    /* ===== إعادة ضبط كل العناصر ===== */
    * {

    /* ===== تنسيق الجسم الرئيسي ===== */

    /* ===== الهيدر الذهبي ===== */
    .quran-header {
      text-align: center;
      padding: 30px 20px;
      border-radius: 30px;
      margin-bottom: 25px;
      /* خلفية شفافة بتأثير زجاجي */
      background: linear-gradient(145deg, rgba(212,175,55,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(212,175,55,0.12);

    /* ===== عنوان المصحف بتدرج ذهبي ===== */

      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #d4af37, #f9e076);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* ===== النص التحتي ===== */
    .quran-header p {
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      margin-top: 5px;
    }
    
    /* ===== الشاشات (تظهر وتختفي) ===== */
    .screen {
      display: none;              /* مخفية افتراضياً */

    }
    .screen.active {
      display: block;             /* تظهر عند إضافة كلاس active */

    /* ===== حركة الظهور ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }

      padding: 5px;
      border: 1px solid rgba(255,255,255,0.06);

    /* ===== خانة الكتابة ===== */
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 20px;
      color: #e0e0e0;
      font-family: 'El Messiri', sans-serif;
      font-size: 16px;
      outline: none;
    }
    
    /* ===== لون النص الإرشادي ===== */

      color: rgba(255,255,255,0.3);

    /* ===== أزرار البحث والميكروفون ===== */

      border-radius: 25px;

      cursor: pointer;
      font-size: 18px;

    /* ===== تأثير hover على الأزرار ===== */

<script>
  // تهيئة فايربيس
  const firebaseConfig = {
    apiKey: "AIzaSyC9uyTILCMVlCeNNuVJvDjrQJ25bP3IHKA",
    authDomain: "muslim-30567.firebaseapp.com",
    databaseURL: "https://muslim-30567-default-rtdb.firebaseio.com",
    projectId: "muslim-30567",
    storageBucket: "muslim-30567.firebasestorage.app",
    messagingSenderId: "477829492310",
    appId: "1:477829492310:web:aa139ac9360fd9232a15f7",
    measurementId: "G-8D34E6NGBF" // مُعرف Firebase Analytics
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  
  const auth = firebase.auth();
  const database = firebase.database();
  const analytics = firebase.analytics(); // تفعيل Firebase Analytics لتتبع الزيارات العامة
  
  // نظام تتبع الوقت الذي يقضيه الزائر في قراءة المصحف
  let visitStartTime = Date.now();
  let visitorName = "زائر مجهول";
  let visitorId = "anon_" + Math.random().toString(36).substring(2, 10);

  // التعرف على المستخدم إذا كان مسجلاً (بدون طرد الزوار غير المسجلين)
  auth.onAuthStateChanged((user) => {
    if (user) {
      visitorId = user.uid;
      visitorName = user.displayName || user.email;
    }
  });

  // حساب وإرسال وقت القراءة عند الخروج من الصفحة أو إغلاقها
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      let timeSpentMs = Date.now() - visitStartTime;
      let timeSpentSeconds = Math.floor(timeSpentMs / 1000);
      
      // تسجيل الوقت فقط إذا قضى أكثر من 5 ثوانٍ
      if (timeSpentSeconds > 5) {
        // 1. تسجيل في Realtime Database (للإحصائيات المخصصة الخاصة بك)
        database.ref('analytics/mushaf_time').push({
          uid: visitorId,
          name: visitorName,
          duration_seconds: timeSpentSeconds,
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          date: new Date().toLocaleDateString('ar-EG')
        });

        // 2. تسجيل كـ Event مخصص في Firebase Analytics
        analytics.logEvent('read_quran_duration', {
          duration_seconds: timeSpentSeconds,
          user_type: visitorName === "زائر مجهول" ? "anonymous" : "registered"
        });
      }
    } else {
      // إعادة تعيين العداد عند العودة للصفحة
      visitStartTime = Date.now();
    }
  });
</script>

<script>
  // ===== متغيرات عامة =====
  let quranData = [];           // يحتوي على بيانات جميع السور
  let recognition = null;       // للبحث الصوتي
  let isRecording = false;     // حالة التسجيل

  // =================================================================
  // ===== 1. تحميل السور من API =====
  // =================================================================
  async function loadSurahs() {
    try {
      // جلب البيانات من API
      const response = await fetch('https://api.alquran.cloud/v1/surah');
      const data = await response.json();
      
      // تخزين البيانات في المتغير العام
      quranData = data.data;
      
      // عرض السور
      renderSurahs(quranData);
      
    } catch(error) {
      // في حالة فشل التحميل
      document.getElementById('surahGrid').innerHTML = 
        '<div class="empty-msg">❌ فشل تحميل السور. تأكد من اتصالك بالإنترنت.</div>';
    }
  }

  // =================================================================
  // ===== 2. عرض السور في الشبكة =====
  // =================================================================
  function renderSurahs(surahs) {
    const grid = document.getElementById('surahGrid');
    
    // لو مفيش نتائج
    if (!surahs || surahs.length === 0) {
      grid.innerHTML = '<div class="empty-msg">📭 لا توجد نتائج</div>';
      return;
    }
    
    // تحويل كل سورة إلى بطاقة HTML
    grid.innerHTML = surahs.map(s => `
      <div class="surah-card" onclick="loadSurah(${s.number})">
        <div class="number">${s.number}</div>
        <div class="name">${s.name}</div>
        <div class="name-ar">${s.englishName}</div>
      </div>
    `).join('');
  }

  // =================================================================
  // ===== 3. البحث في السور =====
  // =================================================================
  function filterSurahs() {
    // جلب النص من خانة البحث
    const query = document.getElementById('searchInput').value.toLowerCase();
    
    // لو فاضي → عرض الكل
    if (!query) {
      renderSurahs(quranData);
      return;
    }
    
    // تصفية السور حسب الاسم أو الرقم
    const filtered = quranData.filter(s => 
      s.name.toLowerCase().includes(query) ||          // بالعربي
      s.englishName.toLowerCase().includes(query) ||   // بالإنجليزي
      s.number.toString().includes(query)              // بالرقم
    );
    
    // عرض النتائج المصفاة
    renderSurahs(filtered);
  }

  // =================================================================
  // ===== 4. تحميل وعرض سورة معينة =====
  // =================================================================
  async function loadSurah(number) {
    // ==== 4.1 التبديل للشاشة فوراً ====
    document.getElementById('surahName').textContent = '⏳ جاري التحميل...';
    document.getElementById('indexScreen').classList.remove('active');
    document.getElementById('surahScreen').classList.add('active');
    
    try {
      // ==== 4.2 جلب الآيات من API ====
      const response = await fetch(`https://api.alquran.cloud/v1/surah/${number}`);
      const data = await response.json();
      const ayahs = data.data.ayahs;
      
      // ==== 4.3 جلب معلومات السورة ====
      const info = quranData.find(s => s.number === number);
      
      // ==== 4.4 عرض اسم السورة ====
      document.getElementById('surahName').textContent = `سورة ${info.name}`;
      
      // ==== 4.5 عرض البسملة (ما عدا سورة التوبة رقم 9) ====
      const bismillah = document.getElementById('bismillah');
      if (number === 9) {
        bismillah.style.display = 'none';  // سورة التوبة مفيش بسملة
      } else {
        bismillah.style.display = 'block';
        bismillah.textContent = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
      }
      
      // ==== 4.6 عرض الآيات مع أرقامها ====
      document.getElementById('ayaText').innerHTML = ayahs.map((a, i) => 
        `${a.text} <span class="aya-number">﴿${i+1}﴾</span>`
      ).join(' ');
      
      // ==== 4.7 التمرير لأعلى الصفحة ====
      window.scrollTo(0, 0);
      
    } catch(error) {
      // ==== 4.8 في حالة حدوث خطأ ====
      document.getElementById('surahName').textContent = '❌ خطأ في التحميل';
      document.getElementById('ayaText').innerHTML = `
        <div style="text-align:center; color:#ff6b6b; padding:40px;">
          <i class="fas fa-exclamation-circle" style="font-size:40px; display:block; margin-bottom:15px;"></i>
          فشل تحميل السورة.<br>
          تأكد من اتصالك بالإنترنت وحاول مرة أخرى.
          <br><br>
          <button onclick="loadSurah(${number})" 
                  style="background:#d4af37; color:#0a0f1a; border:none; border-radius:30px; 
                         padding:10px 30px; cursor:pointer; font-family:'El Messiri'; font-size:16px;">
            <i class="fas fa-redo"></i> إعادة المحاولة
          </button>
        </div>
      `;
    }
  }

  // =================================================================
  // ===== 5. الرجوع للفهرس =====
  // =================================================================
  function goBack() {
    document.getElementById('surahScreen').classList.remove('active');
    document.getElementById('indexScreen').classList.add('active');
  }

  // =================================================================
  // ===== 6. تغيير حجم الخط =====
  // =================================================================
  function setFontSize(size) {
    // ==== 6.1 إزالة الكلاسات القديمة ====
    const container = document.getElementById('surahContent');
    container.classList.remove('text-small', 'text-medium', 'text-large');
    
    // ==== 6.2 إضافة الكلاس الجديد ====
    container.classList.add(`text-${size}`);
    
    // ==== 6.3 تحديث الأزرار ====
    document.querySelectorAll('.font-controls button').forEach(b => b.classList.remove('active'));
    document.getElementById(`font${size.charAt(0).toUpperCase() + size.slice(1)}`).classList.add('active');
  }

  // =================================================================
  // ===== 7. البحث الصوتي (الميكروفون) =====
  // =================================================================
  function startVoiceSearch() {
    const micBtn = document.getElementById('micBtn');
    const statusDiv = document.getElementById('voiceStatus');
    
    // ==== 7.1 التحقق من دعم المتصفح ====
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      statusDiv.textContent = '❌ متصفحك لا يدعم البحث الصوتي';
      setTimeout(() => statusDiv.textContent = '', 3000);
      return;
    }
    
    // ==== 7.2 لو التسجيل شغال → أوقفه ====
    if (recognition) {
      recognition.stop();
      recognition = null;
      micBtn.classList.remove('recording');
      statusDiv.textContent = '⏹️ تم إيقاف التسجيل';
      setTimeout(() => statusDiv.textContent = '', 1500);
      return;
    }
    
    // ==== 7.3 بدء التسجيل ====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-EG';           // اللغة العربية
    recognition.interimResults = false;   // النتيجة النهائية فقط
    recognition.maxAlternatives = 1;      // أفضل نتيجة واحدة
    
    // ==== 7.4 عند بدء التسجيل ====
    recognition.onstart = function() {
      isRecording = true;
      micBtn.classList.add('recording');
      statusDiv.textContent = '🎙️ جاري الاستماع... تحدث الآن';
    };
    
    // ==== 7.5 عند ظهور النتيجة ====
    recognition.onresult = function(event) {
      const text = event.results[0][0].transcript;
      statusDiv.textContent = `📝 تم التعرف على: "${text}"`;
      
      // وضع النص في خانة البحث وتصفية السور
      const searchInput = document.getElementById('searchInput');
      searchInput.value = text;
      filterSurahs();
      
      setTimeout(() => statusDiv.textContent = '', 3000);
    };
    
    // ==== 7.6 عند حدوث خطأ ====
    recognition.onerror = function(event) {
      if (event.error === 'not-allowed') {
        statusDiv.textContent = '❌ يرجى السماح للموقع باستخدام الميكروفون';
      } else if (event.error === 'no-speech') {
        statusDiv.textContent = '🔇 لم يتم سماع صوت، حاول مرة أخرى';
      } else {
        statusDiv.textContent = `❌ خطأ: ${event.error}`;
      }
      micBtn.classList.remove('recording');
      recognition = null;
      setTimeout(() => statusDiv.textContent = '', 3000);
    };
    
    // ==== 7.7 عند انتهاء التسجيل ====
    recognition.onend = function() {
      micBtn.classList.remove('recording');
      recognition = null;
      isRecording = false;
      if (statusDiv.textContent === '🎙️ جاري الاستماع... تحدث الآن') {
        statusDiv.textContent = '⏹️ انتهى الاستماع';
        setTimeout(() => statusDiv.textContent = '', 1500);
      }
    };
    
    // ==== 7.8 تشغيل ====
    recognition.start();
  }

  // =================================================================
  // ===== 8. تشغيل الموقع =====
  // =================================================================
  loadSurahs();
</script>

</body>
</html>
