<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عبد الرحمن للخدمات الإسلامية</title>
  <link rel="icon" href="favicon.png" type="image/png">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #080c14; /* لون خلفية أعمق وأكثر فخامة */
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    * { scrollbar-width: none !important; }
    ::-webkit-scrollbar { display: none !important; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    .header {
      text-align: center;
      padding: 30px 20px;
      border-radius: 25px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, rgba(212,175,55,0.08) 0%, rgba(10,15,26,0.8) 100%);
      border: 1px solid rgba(212,175,55,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .header h1 {
      font-size: 34px;
      background: linear-gradient(135deg, #e8c678, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: rgba(255,255,255,0.6); font-size: 16px; }
    
    .screen { display: none; animation: fadeUp 0.5s ease; }
    .screen.active { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .reciters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 15px;
    }
    .reciter-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .reciter-card:hover {
      background: rgba(212,175,55,0.05);
      border-color: rgba(212,175,55,0.4);
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }
    
    /* تصميم صور الشيوخ الحقيقية */
    .reciter-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 15px;
      display: block;
      border: 2px solid rgba(212,175,55,0.2);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: all 0.4s;
    }
    .reciter-card:hover .reciter-img {
      border-color: #d4af37;
      box-shadow: 0 8px 25px rgba(212,175,55,0.3);
      transform: scale(1.08);
    }
    
    .reciter-card .name { font-size: 17px; font-weight: 700; color: #f4f4f4; }
    
    .back-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 10px 20px;
      color: #e0e0e0;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
    }
    .back-btn:hover { background: rgba(212,175,55,0.15); border-color: #d4af37; color: #fff; }
    
    .reciter-title {
      text-align: center;
      padding: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(212,175,55,0.15);
    }
    .reciter-title h2 { font-size: 24px; color: #d4af37; font-family: 'Cairo', sans-serif; }
    
    /* ===== تصميم مربع البحث مع زر المايك ===== */
    .search-container {
      position: relative;
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
    }
    .search-input-wrapper input {
      width: 100%;
      padding: 15px 45px 15px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    .search-input-wrapper input:focus {
      border-color: #d4af37;
      background: rgba(212,175,55,0.05);
      box-shadow: 0 0 15px rgba(212,175,55,0.15);
    }
    .search-input-wrapper input::placeholder { color: rgba(255,255,255,0.4); }
    .search-input-wrapper .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #d4af37;
      font-size: 16px;
      pointer-events: none;
    }
    
    .mic-btn {
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      min-width: 52px;
      color: #d4af37;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn:hover { background: rgba(212,175,55,0.2); transform: scale(1.05); box-shadow: 0 0 15px rgba(212,175,55,0.2); }
    .mic-btn.listening {
      background: #e74c3c;
      border-color: #e74c3c;
      color: white;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
      100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }

    .surah-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }
    .surah-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .surah-card:hover {
      background: rgba(212,175,55,0.08);
      border-color: rgba(212,175,55,0.4);
      transform: translateY(-4px);
    }
    .surah-card .number {
      display: inline-block;
      background: rgba(212,175,55,0.1);
      color: #d4af37;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      line-height: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .surah-card .name { 
      font-family: 'Amiri', serif;
      font-size: 19px; 
      font-weight: 700; 
      color: #f8f8f8; 
      line-height: 1.6;
    }
    
    .audio-player {
      background: linear-gradient(145deg, rgba(20,28,43,0.95), rgba(10,15,26,0.98));
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 25px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .audio-player .surah-name {
      font-family: 'Amiri', serif;
      font-size: 30px;
      font-weight: 700;
      color: #e8c678;
      line-height: 1.8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .audio-player .reciter-name {
      font-size: 16px;
      color: #b0b0b0;
      margin-top: 5px;
    }
    .audio-player audio {
      width: 100%;
      border-radius: 30px;
      margin-top: 20px;
      background: rgba(0,0,0,0.4);
    }
    
    .audio-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .audio-controls button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      color: #e0e0e0;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }
    .audio-controls button:hover {
      background: rgba(212,175,55,0.15);
      border-color: #d4af37;
      color: #fff;
    }
    .audio-controls button.active {
      background: rgba(76, 175, 80, 0.2);
      border-color: #4CAF50;
      color: #4CAF50;
    }
    .audio-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .audio-controls select {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 30px;
      padding: 10px 18px;
      color: #d4af37;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: 0.3s;
    }
    .audio-controls select:hover { border-color: #e8c678; }
    .audio-controls select option { background: #080c14; color: #e0e0e0; }
    
    .empty-msg {
      text-align: center;
      color: rgba(255,255,255,0.4);
      padding: 50px 20px;
      font-size: 16px;
    }
    
    .home-btn {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 50%;
      width: 55px;
      height: 55px;
      color: #d4af37;
      font-size: 22px;
      cursor: pointer;
      transition: 0.3s;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .home-btn:hover { background: rgba(212,175,55,0.3); transform: scale(1.08); color: #fff; }
  </style>
</head>
<body style="display: none;">

<div class="container">
  
  <div class="header">
    <h1>🎙️ القراء</h1>
    <p>اختر القارئ ثم السورة للاستماع</p>
  </div>

  <!-- ===== شاشة 1: قائمة القراء ===== -->
  <div class="screen active" id="recitersScreen">
    <div class="reciters-grid" id="recitersGrid">
      <div class="empty-msg">⏳ جاري التحميل...</div>
    </div>
  </div>

  <!-- ===== شاشة 2: سور القارئ ===== -->
  <div class="screen" id="surahsScreen">
    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-right"></i> رجوع للقراء
    </button>
    <div class="reciter-title">
      <h2 id="reciterTitle">اختر السورة</h2>
    </div>
    
    <!-- مربع البحث مع زر المايك -->
    <div class="search-container">
      <div class="search-input-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="surahSearch" placeholder="ابحث باسم السورة أو رقمها..." onkeyup="filterSurahs()">
      </div>
      <button class="mic-btn" id="micBtn" onclick="startVoiceSearch()" title="البحث بالصوت">
        <i class="fas fa-microphone" id="micIcon"></i>
      </button>
    </div>

    <div class="surah-grid" id="surahGrid">
      <div class="empty-msg">⏳ جاري التحميل...</div>
    </div>
  </div>

  <!-- ===== شاشة 3: مشغل الصوت ===== -->
  <div class="screen" id="audioScreen">
    <button class="back-btn" onclick="goBackToSurahs()">
      <i class="fas fa-arrow-right"></i> رجوع للسور
    </button>
    
    <div class="audio-player">
      <div class="surah-name" id="audioSurahName">اختر سورة للاستماع</div>
      <div class="reciter-name" id="audioReciterName">القارئ</div>
      
      <audio controls id="audioElement" controlsList="nodownload noplaybackrate">
        <source src="" type="audio/mpeg">
        متصفحك لا يدعم الصوت
      </audio>
      
      <div class="audio-controls">
        <button id="loopBtn" onclick="toggleLoop()" title="تكرار">
          <i class="fas fa-repeat"></i>
        </button>
        
        <button id="downloadBtn" onclick="downloadCurrentSurah()" title="تحميل السورة">
          <i class="fas fa-download"></i>
        </button>
        
        <select id="speedSelect" onchange="changeSpeed()" title="سرعة التشغيل">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
        </select>
      </div>
    </div>
  </div>

  <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
</div>

<!-- ===== Firebase ===== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
  // =============================================================
  // ===== تهيئة Firebase والتحقق من تسجيل الدخول (Auth Guard) =====
  // =============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyC9uyTILCMVlCeNNuVJvDjrQJ25bP3IHKA",
    authDomain: "muslim-30567.firebaseapp.com",
    projectId: "muslim-30567",
    appId: "1:477829492310:web:aa139ac9360fd9232a15f7"
  };
  
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  
  auth.onAuthStateChanged((user) => {
    if (user) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('index.html'); 
    }
  });

  // إضافة صور الشيوخ الموثوقة والمباشرة
  const reciters = [
    { code: 'hussary', name: 'محمود الحصري', img: 'https://i1.sndcdn.com/artworks-000100416973-1r8zqy-t500x500.jpg' },
    { code: 'basit', name: 'عبد الباسط عبد الصمد', img: 'https://i1.sndcdn.com/artworks-000147983652-3r3shk-t500x500.jpg' },
    { code: 'minsh', name: 'محمد صديق المنشاوي', img: 'https://i1.sndcdn.com/artworks-000216781297-f58i57-t500x500.jpg' },
    { code: 'afs', name: 'مشاري العفاسي', img: 'https://i1.sndcdn.com/artworks-000135671151-5b7l6x-t500x500.jpg' },
    { code: 'shur', name: 'سعود الشريم', img: 'https://i1.sndcdn.com/artworks-000146316281-7t7j2a-t500x500.jpg' },
    { code: 'maher', name: 'ماهر المعيقلي', img: 'https://i1.sndcdn.com/artworks-000085189254-9hxhx1-t500x500.jpg' }
  ];
  
  const reciterUrls = {
    hussary: 'https://server13.mp3quran.net/hussary',
    basit: 'https://server7.mp3quran.net/basit',
    minsh: 'https://server10.mp3quran.net/minsh',
    afs: 'https://server8.mp3quran.net/afs',
    shur: 'https://server7.mp3quran.net/shur',
    maher: 'https://server12.mp3quran.net/maher'
  };
  
  let quranData = [];
  let currentReciter = null;
  let currentReciterCode = null;
  let isLooping = false;
  let recognition = null;
  let isListening = false;
  
  async function loadSurahs() {
    try {
      const res = await fetch('https://api.alquran.cloud/v1/surah');
      const data = await res.json();
      quranData = data.data;
    } catch(e) {
      console.log('خطأ في تحميل السور');
    }
  }
  
  // دالة عرض الشيوخ المحدثة لاستخدام الصور
  function showReciters() {
    const grid = document.getElementById('recitersGrid');
    grid.innerHTML = reciters.map(r => `
      <div class="reciter-card" onclick="selectReciter('${r.code}', '${r.name}')">
        <img src="${r.img}" alt="${r.name}" class="reciter-img" loading="lazy">
        <div class="name">${r.name}</div>
      </div>
    `).join('');
  }
  
  function selectReciter(code, name) {
    currentReciter = name;
    currentReciterCode = code;
    
    document.getElementById('reciterTitle').textContent = `📖 سور القارئ ${name}`;
    document.getElementById('recitersScreen').classList.remove('active');
    document.getElementById('surahsScreen').classList.add('active');
    
    document.getElementById('surahSearch').value = '';
    
    showSurahs();
  }
  
  function showSurahs() {
    const grid = document.getElementById('surahGrid');
    grid.innerHTML = quranData.map(s => `
      <div class="surah-card" onclick="playSurah(${s.number})">
        <div class="number">${s.number}</div>
        <div class="name">${s.name}</div>
      </div>
    `).join('');
  }

  function filterSurahs() {
    const searchTerm = document.getElementById('surahSearch').value.trim().toLowerCase();
    const cards = document.querySelectorAll('#surahGrid .surah-card');
    
    cards.forEach(card => {
      const surahName = card.querySelector('.name').innerText.toLowerCase();
      const surahNumber = card.querySelector('.number').innerText;
      
      const cleanName = surahName.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
      const cleanSearch = searchTerm.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
      
      if (cleanName.includes(cleanSearch) || surahNumber.includes(cleanSearch)) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function startVoiceSearch() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      alert('متصفحك لا يدعم البحث الصوتي. جرب Chrome أو Safari.');
      return;
    }
    
    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    
    if (isListening && recognition) {
      recognition.stop();
      return;
    }
    
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-SA';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    
    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      micIcon.className = 'fas fa-stop';
      document.getElementById('surahSearch').placeholder = '🎤 جاري الاستماع...';
    };
    
    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      
      const searchInput = document.getElementById('surahSearch');
      searchInput.value = transcript;
      
      if (event.results[event.results.length - 1].isFinal) {
        filterSurahs();
      }
    };
    
    recognition.onerror = (event) => {
      console.error('خطأ في التعرف على الصوت:', event.error);
      if (event.error === 'not-allowed') {
        alert('يجب السماح بالوصول للميكروفون');
      } else if (event.error === 'no-speech') {
        alert('لم يتم التقاط أي صوت، حاول مرة أخرى');
      }
    };
    
    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      micIcon.className = 'fas fa-microphone';
      document.getElementById('surahSearch').placeholder = 'ابحث باسم السورة أو رقمها...';
      
      filterSurahs();
    };
    
    try {
      recognition.start();
    } catch (e) {
      console.error(e);
    }
  }
  
  function playSurah(number) {
    const url = `${reciterUrls[currentReciterCode]}/${String(number).padStart(3, '0')}.mp3`;
    const surah = quranData.find(s => s.number === number);
    
    document.getElementById('audioSurahName').textContent = `سورة ${surah.name}`;
    document.getElementById('audioReciterName').textContent = `القارئ: ${currentReciter}`;
    
    isLooping = false;
    document.getElementById('loopBtn').classList.remove('active');
    document.getElementById('loopBtn').innerHTML = '<i class="fas fa-repeat"></i>';
    document.getElementById('speedSelect').value = '1.0';
    
    const audio = document.getElementById('audioElement');
    audio.playbackRate = 1.0;
    audio.src = url;
    audio.load();
    audio.play();
    
    document.getElementById('surahsScreen').classList.remove('active');
    document.getElementById('audioScreen').classList.add('active');
  }
  
  function toggleLoop() {
    isLooping = !isLooping;
    const btn = document.getElementById('loopBtn');
    if (isLooping) {
      btn.classList.add('active');
      btn.innerHTML = '<i class="fas fa-repeat"></i>';
    } else {
      btn.classList.remove('active');
      btn.innerHTML = '<i class="fas fa-repeat"></i>';
    }
  }
  
  function changeSpeed() {
    const speed = document.getElementById('speedSelect').value;
    document.getElementById('audioElement').playbackRate = parseFloat(speed);
  }

  async function downloadCurrentSurah() {
    const audio = document.getElementById('audioElement');
    if (!audio.src) return;
    
    const btn = document.getElementById('downloadBtn');
    const originalIcon = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    btn.disabled = true;
    
    try {
      const response = await fetch(audio.src, { mode: 'cors' });
      if (!response.ok) throw new Error('فشل التحميل');
      
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      
      const surahName = document.getElementById('audioSurahName').textContent
        .replace('سورة ', '').trim();
      const reciterName = currentReciter || 'قارئ';
      const fileName = `${surahName} - ${reciterName}.mp3`;
      
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
      
    } catch (err) {
      console.error('خطأ في التحميل:', err);
      alert('تعذر تحميل الملف، حاول مرة أخرى');
    } finally {
      btn.innerHTML = originalIcon;
      btn.disabled = false;
    }
  }
  
  document.getElementById('audioElement').addEventListener('ended', function() {
    if (isLooping) {
      this.currentTime = 0;
      this.play();
    }
  });
  
  function goBack() {
    document.getElementById('surahsScreen').classList.remove('active');
    document.getElementById('recitersScreen').classList.add('active');
  }
  
  function goBackToSurahs() {
    document.getElementById('audioScreen').classList.remove('active');
    document.getElementById('surahsScreen').classList.add('active');
  }
  
  loadSurahs();
  setTimeout(showReciters, 300);
</script>

</body>
</html>
