<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نور القرآن</title>
  <link rel="icon" href="Favicon.png" type="image/png">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ===== متغيرات الثيم الأزرق الملكي ===== */
    :root {
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --primary-dark: #1e40af;
      --accent: #93c5fd;
      --bg: #060a14;
      --bg-2: #0a1224;
      --card: rgba(255,255,255,0.03);
      --card-hover: rgba(59,130,246,0.08);
      --border: rgba(255,255,255,0.06);
      --border-primary: rgba(59,130,246,0.3);
      --text: #e8eefc;
      --text-muted: #7d8db0;
      --green: #10b981;
      --red: #ef4444;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 15% 10%, rgba(59,130,246,0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(30,64,175,0.1) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }
    
    * { scrollbar-width: none !important; }
    ::-webkit-scrollbar { display: none !important; }
    
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px 100px;
      position: relative;
      z-index: 1;
    }
    
    /* ===== الهيدر ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 25px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .header .logo-box { display: flex; align-items: center; gap: 12px; }
    .header .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 6px 20px rgba(59,130,246,0.4);
    }
    .header .logo-text h1 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .header .logo-text p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    
    /* ===== الشاشات ===== */
    .screen { display: none; animation: fadeSlide 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
    .screen.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* ===== عنوان القسم ===== */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 0 4px;
    }
    .section-title .bar {
      width: 4px;
      height: 22px;
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      border-radius: 4px;
    }
    .section-title h2 { font-size: 20px; font-weight: 700; color: #fff; }
    .section-title .count {
      margin-right: auto;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--card);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    
    /* ===== القراء ===== */
    .reciters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .reciter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }
    .reciter-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59,130,246,0.12), transparent);
      opacity: 0;
      transition: 0.3s;
    }
    .reciter-card:hover {
      border-color: var(--border-primary);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .reciter-card:hover::before { opacity: 1; }
    .reciter-card .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.05));
      border: 1.5px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--primary-light);
      position: relative;
      z-index: 1;
    }
    .reciter-card .name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      position: relative;
      z-index: 1;
      line-height: 1.4;
    }
    
    /* ===== زر الرجوع ===== */
    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 18px;
      color: var(--text);
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.25s;
    }
    .back-btn:hover {
      border-color: var(--border-primary);
      color: var(--primary-light);
      transform: translateX(-3px);
    }
    
    /* ===== شريط البحث ===== */
    .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-input-wrapper { position: relative; flex: 1; }
    .search-input-wrapper input {
      width: 100%;
      padding: 14px 46px 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }
    .search-input-wrapper input:focus {
      border-color: var(--border-primary);
      background: rgba(59,130,246,0.05);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
    }
    .search-input-wrapper input::placeholder { color: var(--text-muted); }
    .search-input-wrapper .search-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-light);
      font-size: 15px;
      pointer-events: none;
    }
    
    .mic-btn {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--primary-light);
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn:hover { border-color: var(--border-primary); background: rgba(59,130,246,0.1); }
    .mic-btn.listening {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      animation: pulse 1.3s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
      70% { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    
    /* ===== السور ===== */
    .surah-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .surah-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .surah-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary), transparent);
      opacity: 0;
      transition: 0.3s;
    }
    .surah-card:hover {
      border-color: var(--border-primary);
      background: var(--card-hover);
      transform: translateY(-3px);
    }
    .surah-card:hover::after { opacity: 1; }
    .surah-card .number {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(59,130,246,0.12);
      border: 1px solid var(--border-primary);
      color: var(--primary-light);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .surah-card .name {
      font-family: 'Amiri', serif;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.7;
    }
    
    /* ===== المشغل ===== */
    .player-card {
      background: linear-gradient(160deg, rgba(15,25,50,0.9), rgba(10,18,36,0.95));
      border: 1px solid var(--border-primary);
      border-radius: 28px;
      padding: 35px 22px 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .player-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,0.2), transparent 70%);
      pointer-events: none;
    }
    
    .player-art {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(59,130,246,0.4);
      animation: rotate 20s linear infinite;
      animation-play-state: paused;
    }
    .player-art.playing { animation-play-state: running; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    
    .player-surah {
      font-family: 'Amiri', serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.6;
      position: relative;
    }
    .player-reciter {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
      margin-bottom: 22px;
    }
    
    .player-card audio {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 18px;
      filter: invert(0.92) hue-rotate(180deg) saturate(0.6);
    }
    
    .audio-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .audio-controls button {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .audio-controls button:hover {
      border-color: var(--border-primary);
      color: var(--primary-light);
      transform: translateY(-2px);
    }
    .audio-controls button.active {
      background: rgba(16,185,129,0.15);
      border-color: var(--green);
      color: var(--green);
    }
    .audio-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .audio-controls select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--primary-light);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      height: 48px;
    }
    .audio-controls select option { background: #0a1224; color: var(--text); }
    
    /* ===== زر الهوم ===== */
    .home-btn {
      position: fixed;
      bottom: 22px;
      left: 22px;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(59,130,246,0.4);
      transition: 0.3s;
      z-index: 100;
    }
    .home-btn:hover { transform: translateY(-3px) scale(1.05); }
    
    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 50px 20px;
      font-size: 15px;
      grid-column: 1 / -1;
    }
    
    @media (max-width: 480px) {
      .container { padding: 16px 12px 90px; }
      .header .logo-text h1 { font-size: 17px; }
      .section-title h2 { font-size: 18px; }
      .reciters-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .surah-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .surah-card .name { font-size: 15px; }
      .player-surah { font-size: 24px; }
      .player-card { padding: 28px 16px 20px; }
    }
  </style>
</head>
<body style="display: none;">

<div class="container">
  
  <div class="header">
    <div class="logo-box">
      <div class="logo-icon"><i class="fas fa-mosque"></i></div>
      <div class="logo-text">
        <h1>نور القرآن</h1>
        <p>استمع • تأمّل • تدبّر</p>
      </div>
    </div>
  </div>

  <div class="screen active" id="recitersScreen">
    <div class="section-title">
      <div class="bar"></div>
      <h2>اختر القارئ</h2>
      <span class="count" id="recitersCount">6 قراء</span>
    </div>
    <div class="reciters-grid" id="recitersGrid">
      <div class="empty-msg">⏳ جاري التحميل...</div>
    </div>
  </div>

  <div class="screen" id="surahsScreen">
    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-right"></i> العودة للقراء
    </button>
    
    <div class="section-title">
      <div class="bar"></div>
      <h2 id="reciterTitle">السور</h2>
      <span class="count" id="surahsCount">114 سورة</span>
    </div>
    
    <div class="search-container">
      <div class="search-input-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="surahSearch" placeholder="ابحث باسم السورة أو رقمها..." onkeyup="filterSurahs()">
      </div>
      <button class="mic-btn" id="micBtn" onclick="startVoiceSearch()" title="البحث بالصوت">
        <i class="fas fa-microphone" id="micIcon"></i>
      </button>
    </div>

    <div class="surah-grid" id="surahGrid">
      <div class="empty-msg">⏳ جاري التحميل...</div>
    </div>
  </div>

  <div class="screen" id="audioScreen">
    <button class="back-btn" onclick="goBackToSurahs()">
      <i class="fas fa-arrow-right"></i> العودة للسور
    </button>
    
    <div class="player-card">
      <div class="player-art" id="playerArt">
        <i class="fas fa-book-open"></i>
      </div>
      <div class="player-surah" id="audioSurahName">اختر سورة</div>
      <div class="player-reciter" id="audioReciterName">القارئ</div>
      
      <audio controls id="audioElement" controlsList="nodownload noplaybackrate">
        <source src="" type="audio/mpeg">
      </audio>
      
      <div class="audio-controls">
        <button id="loopBtn" onclick="toggleLoop()" title="تكرار">
          <i class="fas fa-repeat"></i>
        </button>
        <button id="downloadBtn" onclick="downloadCurrentSurah()" title="تحميل">
          <i class="fas fa-download"></i>
        </button>
        <select id="speedSelect" onchange="changeSpeed()">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
        </select>
      </div>
    </div>
  </div>

  <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC9uyTILCMVlCeNNuVJvDjrQJ25bP3IHKA",
    authDomain: "muslim-30567.firebaseapp.com",
    projectId: "muslim-30567",
    appId: "1:477829492310:web:aa139ac9360fd9232a15f7"
  };
  
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  
  auth.onAuthStateChanged((user) => {
    if (user) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('index.html');
    }
  });

  const reciters = [
    { code: 'hussary', name: 'محمود الحصري' },
    { code: 'basit', name: 'عبد الباسط عبد الصمد' },
    { code: 'minsh', name: 'محمد صديق المنشاوي' },
    { code: 'afs', name: 'مشاري العفاسي' },
    { code: 'shur', name: 'سعود الشريم' },
    { code: 'maher', name: 'ماهر المعيقلي' }
  ];
  
  const reciterUrls = {
    hussary: 'https://server13.mp3quran.net/hussary',
    basit: 'https://server7.mp3quran.net/basit',
    minsh: 'https://server10.mp3quran.net/minsh',
    afs: 'https://server8.mp3quran.net/afs',
    shur: 'https://server7.mp3quran.net/shur',
    maher: 'https://server12.mp3quran.net/maher'
  };
  
  let quranData = [];
  let currentReciter = null;
  let currentReciterCode = null;
  let isLooping = false;
  let recognition = null;
  let isListening = false;
  
  async function loadSurahs() {
    try {
      const res = await fetch('https://api.alquran.cloud/v1/surah');
      const data = await res.json();
      quranData = data.data;
    } catch(e) { console.log('خطأ في تحميل السور'); }
  }
  
  function showReciters() {
    const grid = document.getElementById('recitersGrid');
    grid.innerHTML = reciters.map(r => `
      <div class="reciter-card" onclick="selectReciter('${r.code}', '${r.name}')">
        <div class="avatar"><i class="fas fa-user-tie"></i></div>
        <div class="name">${r.name}</div>
      </div>
    `).join('');
    document.getElementById('recitersCount').textContent = reciters.length + ' قراء';
  }
  
  function selectReciter(code, name) {
    currentReciter = name;
    currentReciterCode = code;
    
    document.getElementById('reciterTitle').textContent = `سور ${name}`;
    document.getElementById('surahsCount').textContent = '114 سورة';
    document.getElementById('recitersScreen').classList.remove('active');
    document.getElementById('surahsScreen').classList.add('active');
    document.getElementById('surahSearch').value = '';
    
    showSurahs();
  }
  
  function showSurahs() {
    const grid = document.getElementById('surahGrid');
    grid.innerHTML = quranData.map(s => `
      <div class="surah-card" onclick="playSurah(${s.number})">
        <div class="number">${s.number}</div>
        <div class="name">${s.name}</div>
      </div>
    `).join('');
  }

  function filterSurahs() {
    const searchTerm = document.getElementById('surahSearch').value.trim().toLowerCase();
    const cards = document.querySelectorAll('#surahGrid .surah-card');
    let visible = 0;
    
    cards.forEach(card => {
      const surahName = card.querySelector('.name').innerText.toLowerCase();
      const surahNumber = card.querySelector('.number').innerText;
      const cleanName = surahName.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
      const cleanSearch = searchTerm.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
      
      if (cleanName.includes(cleanSearch) || surahNumber.includes(cleanSearch)) {
        card.style.display = 'flex';
        visible++;
      } else {
        card.style.display = 'none';
      }
    });
    
    document.getElementById('surahsCount').textContent = visible + ' سورة';
  }

  function startVoiceSearch() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      alert('متصفحك لا يدعم البحث الصوتي');
      return;
    }
    
    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    
    if (isListening && recognition) {
      recognition.stop();
      return;
    }
    
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-SA';
    recognition.continuous = false;
    recognition.interimResults = true;
    
    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      micIcon.className = 'fas fa-stop';
      document.getElementById('surahSearch').placeholder = '🎤 جاري الاستماع...';
    };
    
    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      document.getElementById('surahSearch').value = transcript;
      if (event.results[event.results.length - 1].isFinal) filterSurahs();
    };
    
    recognition.onerror = (event) => {
      console.error(event.error);
      if (event.error === 'not-allowed') alert('يجب السماح بالوصول للميكروفون');
    };
    
    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      micIcon.className = 'fas fa-microphone';
      document.getElementById('surahSearch').placeholder = 'ابحث باسم السورة أو رقمها...';
      filterSurahs();
    };
    
    try { recognition.start(); } catch(e) { console.error(e); }
  }
  
  function playSurah(number) {
    const url = `${reciterUrls[currentReciterCode]}/${String(number).padStart(3, '0')}.mp3`;
    const surah = quranData.find(s => s.number === number);
    const cleanName = surah.name.replace('سُورَةُ ', '').replace('سورة ', '');
    
    document.getElementById('audioSurahName').textContent = cleanName;
    document.getElementById('audioReciterName').textContent = currentReciter;
    
    isLooping = false;
    document.getElementById('loopBtn').classList.remove('active');
    document.getElementById('speedSelect').value = '1.0';
    
    const audio = document.getElementById('audioElement');
    audio.playbackRate = 1.0;
    audio.src = url;
    audio.load();
    audio.play();
    
    document.getElementById('surahsScreen').classList.remove('active');
    document.getElementById('audioScreen').classList.add('active');
  }
  
  document.getElementById('audioElement').addEventListener('play', function() {
    document.getElementById('playerArt').classList.add('playing');
  });
  document.getElementById('audioElement').addEventListener('pause', function() {
    document.getElementById('playerArt').classList.remove('playing');
  });
  
  function toggleLoop() {
    isLooping = !isLooping;
    document.getElementById('loopBtn').classList.toggle('active', isLooping);
  }
  
  function changeSpeed() {
    const speed = document.getElementById('speedSelect').value;
    document.getElementById('audioElement').playbackRate = parseFloat(speed);
  }

  async function downloadCurrentSurah() {
    const audio = document.getElementById('audioElement');
    if (!audio.src) return;
    
    const btn = document.getElementById('downloadBtn');
    const originalIcon = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    btn.disabled = true;
    
    try {
      const response = await fetch(audio.src, { mode: 'cors' });
      if (!response.ok) throw new Error('فشل التحميل');
      
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      
      const surahName = document.getElementById('audioSurahName').textContent.trim();
      const fileName = `${surahName} - ${currentReciter}.mp3`;
      
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
    } catch (err) {
      alert('تعذر تحميل الملف');
    } finally {
      btn.innerHTML = originalIcon;
      btn.disabled = false;
    }
  }
  
  document.getElementById('audioElement').addEventListener('ended', function() {
    if (isLooping) { this.currentTime = 0; this.play(); }
  });
  
  function goBack() {
    document.getElementById('surahsScreen').classList.remove('active');
    document.getElementById('recitersScreen').classList.add('active');
  }
  
  function goBackToSurahs() {
    document.getElementById('audioScreen').classList.remove('active');
    document.getElementById('surahsScreen').classList.add('active');
  }
  
  loadSurahs();
  setTimeout(showReciters, 300);
</script>

</body>
</html>
