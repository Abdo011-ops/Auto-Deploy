<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>الفيديوهات | موقع مسلم</title>
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'El Messiri', sans-serif;
      background: #0a0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(ellipse at top, rgba(212,175,55,0.05), transparent 70%);
    }
    
    * { scrollbar-width: none !important; }
    ::-webkit-scrollbar { display: none !important; }

    .container { max-width: 420px; margin: 0 auto; }

    .header {
      text-align: center;
      padding: 25px 20px;
      border-radius: 24px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, rgba(212,175,55,0.05), rgba(255,255,255,0.02));
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #d4af37, #f9e076);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      margin-top: 5px;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      padding: 8px 16px;
      color: #e0e0e0;
      cursor: pointer;
      font-family: 'El Messiri', sans-serif;
      font-size: 14px;
      transition: 0.3s;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .back-btn:hover {
      background: rgba(212,175,55,0.1);
      border-color: #d4af37;
    }

    .upload-status {
      color: #d4af37;
      text-align: center;
      font-size: 14px;
      margin: 10px 0;
      min-height: 25px;
    }

    /* ===== حاوية الفيديوهات ===== */
    .video-container {
      height: 75vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      position: relative;
      background: #0a0f1a;
      border-radius: 20px;
      padding: 0;
    }
    .video-item {
      height: 75vh;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0f1a;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }
    .video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      background: #000;
    }

    /* ===== أزرار التفاعل ===== */
    .interaction-circle {
      position: absolute;
      left: 10px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 14px 10px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 50;
    }
    .interaction-btn {
      background: transparent;
      border: none;
      width: 40px;
      height: 40px;
      color: #e0e0e0;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .interaction-btn:hover {
      transform: scale(1.15);
      color: #d4af37;
    }
    .interaction-btn .count {
      position: absolute;
      bottom: -18px;
      font-size: 10px;
      color: #aaa;
    }

    /* ===== نافذة التعليقات ===== */
    .comments-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
    }
    .comments-overlay.active { display: flex; }
    .comments-box {
      background: linear-gradient(145deg, #141c2b, #0a0f1a);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 24px;
      padding: 25px;
      max-width: 400px;
      width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .comments-box h3 {
      color: #d4af37;
      margin-bottom: 15px;
      text-align: center;
    }
    .comments-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .comment-item {
      background: rgba(255,255,255,0.05);
      padding: 10px 14px;
      border-radius: 12px;
      border-right: 3px solid #d4af37;
    }
    .comment-item .cname {
      font-size: 12px;
      color: #d4af37;
      font-weight: bold;
    }
    .comment-item .ctext {
      font-size: 14px;
      margin-top: 4px;
    }
    .comment-input-area {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .comment-input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      color: white;
      font-family: 'El Messiri';
      outline: none;
    }
    .comment-input-area button {
      background: #d4af37;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #0a0f1a;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    .comments-close {
      background: rgba(255,0,0,0.1);
      border: 1px solid rgba(255,0,0,0.2);
      border-radius: 30px;
      padding: 8px;
      color: #ff6b6b;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'El Messiri';
    }

    /* ===== زر رفع الفيديو ===== */
    .upload-video-btn {
      position: fixed;
      bottom: 100px;
      right: 20px;
      background: #d4af37;
      color: #0a0f1a;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212,175,55,0.4);
      transition: 0.25s;
      z-index: 999;
    }
    .upload-video-btn:hover {
      transform: scale(1.05);
      background: #f0d060;
    }

    .empty-msg {
      text-align: center;
      color: rgba(255,255,255,0.3);
      padding: 60px 20px;
      font-size: 18px;
    }
  </style>
</head>
<body style="display: none;"> <!-- إخفاء الشاشة مؤقتاً لحين التحقق -->

  <!-- ===== زر الرجوع ===== -->
  <a href="index.html" class="back-btn">
    <i class="fas fa-arrow-right"></i> رجوع
  </a>

  <div class="container">
    
    <!-- ===== الهيدر ===== -->
    <div class="header">
      <h1>🎬 الفيديوهات</h1>
      <p>شاهد الفيديوهات المرفوعة، ويمكنك رفع فيديو جديد</p>
    </div>

    <!-- ===== حالة الرفع ===== -->
    <div class="upload-status" id="uploadStatus"></div>

    <!-- ===== حاوية الفيديوهات ===== -->
    <div class="video-container" id="videoContainer">
      <div class="empty-msg" id="emptyMsg">📭 لا توجد فيديوهات بعد</div>
    </div>

    <!-- ===== زر رفع فيديو ===== -->
    <button class="upload-video-btn" id="uploadVideoBtn" title="رفع فيديو">
      <i class="fas fa-plus"></i>
    </button>

  </div>

  <!-- ===== نافذة التعليقات ===== -->
  <div class="comments-overlay" id="commentsOverlay">
    <div class="comments-box">
      <h3><i class="fas fa-comment-dots"></i> التعليقات</h3>
      <div class="comments-list" id="commentsList">
        <div style="color:#888; text-align:center; padding:20px;">لا توجد تعليقات بعد.</div>
      </div>
      <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="اكتب تعليقاً..." onkeypress="if(event.key==='Enter') submitComment()">
        <button onclick="submitComment()"><i class="fas fa-paper-plane"></i></button>
      </div>
      <button class="comments-close" onclick="closeComments()">إغلاق</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== جافا سكريبت ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, push, onValue, remove, update, off, get } from "firebase/database";
    import { getAuth, onAuthStateChanged } from "firebase/auth";

    // ============================================================
    // ===== إعداد Firebase =====
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyC9uyTILCMVlCeNNuVJvDjrQJ25bP3IHKA",
      authDomain: "muslim-30567.firebaseapp.com",
      databaseURL: "https://muslim-30567-default-rtdb.firebaseio.com",
      projectId: "muslim-30567",
      storageBucket: "muslim-30567.firebasestorage.app",
      messagingSenderId: "477829492310",
      appId: "1:477829492310:web:aa139ac9360fd9232a15f7",
      measurementId: "G-8D34E6NGBF"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // ============================================================
    // ===== متغيرات =====
    // ============================================================
    let currentUser = null;
    let currentVideoId = null;
    let commentListenerStarted = false;

    // ============================================================
    // ===== مراقبة حالة المستخدم والتحقق من الدخول (Auth Guard) =====
    // ============================================================
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // المستخدم مسجل دخول -> إظهار الصفحة
        currentUser = user;
        document.body.style.display = 'block';
      } else {
        // المستخدم غير مسجل دخول -> توجيه للصفحة الرئيسية
        window.location.replace('index.html');
      }
    });

    // ============================================================
    // ===== تحميل الفيديوهات =====
    // ============================================================
    function startVideoListener() {
      const videoRef = ref(database, 'videos');
      onValue(videoRef, (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('videoContainer');
        const emptyMsg = document.getElementById('emptyMsg');
        const items = container.querySelectorAll('.video-item');
        items.forEach(el => el.remove());
        
        if (!data) { 
          emptyMsg.style.display = 'block'; 
          return; 
        }
        emptyMsg.style.display = 'none';
        
        const videosArray = Object.keys(data).reverse().map(key => ({ id: key, ...data[key] }));
        videosArray.forEach((video) => {
          const isVideo = video.url && (video.url.includes('.mp4') || video.url.includes('.webm') || video.url.includes('.mov'));
          if (!isVideo) return;
          
          const div = document.createElement('div'); 
          div.className = 'video-item';
          
          const vid = document.createElement('video');
          vid.src = video.url; 
          vid.controls = true; 
          vid.loop = false; 
          vid.muted = false; 
          vid.playsInline = true; 
          vid.preload = 'metadata'; 
          vid.setAttribute('playsinline', 'true');
          
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { 
              if (entry.isIntersecting) { 
                vid.play().catch(() => {}); 
              } else { 
                vid.pause(); 
              } 
            });
          }, { threshold: 0.6 });
          observer.observe(vid);
          div.appendChild(vid);

          // ===== أزرار التفاعل =====
          const interactionDiv = document.createElement('div');
          interactionDiv.className = 'interaction-circle';

          // زر الإعجاب
          const likeBtn = document.createElement('button');
          likeBtn.className = 'interaction-btn';
          const likesRef = ref(database, `likes/${video.id}`);
          onValue(likesRef, (snapshot) => {
            const likes = snapshot.val() || 0;
            likeBtn.innerHTML = `<i class="fas fa-heart"></i><span class="count">${likes}</span>`;
          });
          likeBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentUser) { 
              alert('يجب تسجيل الدخول للإعجاب'); 
              return; 
            }
            const likesRef = ref(database, `likes/${video.id}`);
            get(likesRef).then((snapshot) => {
              let likes = snapshot.val() || 0;
              likes++;
              set(likesRef, likes);
            });
          };

          // زر التعليق
          const commentBtn = document.createElement('button');
          commentBtn.className = 'interaction-btn';
          const commentsCountRef = ref(database, `comments/${video.id}`);
          onValue(commentsCountRef, (snapshot) => {
            const data = snapshot.val();
            const count = data ? Object.keys(data).length : 0;
            commentBtn.innerHTML = `<i class="fas fa-comment"></i><span class="count">${count}</span>`;
          });
          commentBtn.onclick = function(e) {
            e.stopPropagation();
            currentVideoId = video.id;
            openComments(video.id);
          };

          // زر المشاركة
          const shareBtn = document.createElement('button');
          shareBtn.className = 'interaction-btn';
          shareBtn.innerHTML = `<i class="fas fa-share-alt"></i>`;
          shareBtn.onclick = function(e) {
            e.stopPropagation();
            if (navigator.share) {
              navigator.share({
                title: video.name || 'فيديو إسلامي',
                text: 'شاهد هذا الفيديو الإسلامي',
                url: video.url
              });
            } else {
              navigator.clipboard.writeText(video.url);
              alert('تم نسخ رابط الفيديو!');
            }
          };

          interactionDiv.appendChild(likeBtn);
          interactionDiv.appendChild(commentBtn);
          interactionDiv.appendChild(shareBtn);
          div.appendChild(interactionDiv);

          container.appendChild(div);
        });
        container.scrollTop = 0;
      });
    }

    // ============================================================
    // ===== رفع فيديو =====
    // ============================================================
    document.getElementById('uploadVideoBtn').addEventListener('click', function() {
      if (!currentUser) { 
        alert('يجب تسجيل الدخول لرفع فيديو'); 
        return; 
      }
      
      const widget = cloudinary.createUploadWidget(
        { 
          cloudName: 'uleffceu', 
          uploadPreset: 'ml_default',
          sources: ['local', 'camera', 'url'], 
          multiple: false, 
          resourceType: 'video', 
          folder: 'islamic_videos', 
          tags: ['islamic', 'video'] 
        },
        (error, result) => {
          const status = document.getElementById('uploadStatus');
          if (error) { 
            status.textContent = '❌ خطأ: ' + error.message; 
            setTimeout(() => status.textContent = '', 4000); 
            return; 
          }
          if (result && result.event === 'success') {
            const fileData = { 
              name: result.info.original_filename || 'فيديو', 
              url: result.info.secure_url, 
              type: 'video', 
              timestamp: Date.now(), 
              uploader: currentUser.displayName || 'مستخدم' 
            };
            const videoRef = ref(database, 'videos'); 
            push(videoRef, fileData);
            status.textContent = '✅ تم رفع الفيديو بنجاح!'; 
            setTimeout(() => status.textContent = '', 4000);
          }
        }
      );
      widget.open();
    });

    // ============================================================
    // ===== نظام التعليقات =====
    // ============================================================
    function openComments(videoId) {
      currentVideoId = videoId;
      document.getElementById('commentsOverlay').classList.add('active');
      loadComments(videoId);
    }

    window.closeComments = function() {
      document.getElementById('commentsOverlay').classList.remove('active');
      if (commentListenerStarted) {
        const commentsRef = ref(database, `comments/${currentVideoId}`);
        off(commentsRef);
        commentListenerStarted = false;
      }
    };

    function loadComments(videoId) {
      const commentsRef = ref(database, `comments/${videoId}`);
      onValue(commentsRef, (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('commentsList');
        list.innerHTML = '';
        if (!data) {
          list.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">لا توجد تعليقات بعد.</div>';
          return;
        }
        const commentsArray = Object.keys(data).reverse().map(key => ({ id: key, ...data[key] }));
        commentsArray.forEach(comment => {
          const div = document.createElement('div'); 
          div.className = 'comment-item';
          div.innerHTML = `<div class="cname">${comment.name || 'زائر'}</div><div class="ctext">${comment.text}</div>`;
          list.appendChild(div);
        });
      });
      commentListenerStarted = true;
    }

    window.submitComment = function() {
      if (!currentUser) { 
        alert('يجب تسجيل الدخول للتعليق'); 
        return; 
      }
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) { 
        alert('اكتب تعليقاً أولاً'); 
        return; 
      }
      
      const commentsRef = ref(database, `comments/${currentVideoId}`);
      push(commentsRef, { 
        name: currentUser.displayName || 'مستخدم', 
        text: text,
        timestamp: Date.now()
      });
      input.value = '';
    };

    // ============================================================
    // ===== تشغيل =====
    // ============================================================
    startVideoListener();
    console.log('✅ صفحة الفيديوهات - تم التحميل بنجاح');
  </script>

</body>
</html>
