  // مصفوفة الأحاديث الـ 20 بنصوصها الطويلة والكاملة
  const ahadith = [
    { text: "عن أمير المؤمنين أبي حفص عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله، فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها، فهجرته إلى ما هاجر إليه».", source: "رواه البخاري ومسلم" },
    { text: "عن عمر بن الخطاب رضي الله عنه قال: بينما نحن جلوس عند رسول الله ﷺ ذات يوم، إذ طلع علينا رجل شديد بياض الثياب، شديد سواد الشعر، لا يُرى عليه أثر السفر، ولا يعرفه منا أحد، حتى جلس إلى النبي ﷺ فأسند ركبتيه إلى ركبتيه، ووضع كفيه على فخذيه، وقال: يا محمد أخبرني عن الإسلام. فقال رسول الله ﷺ: «الإسلام أن تشهد أن لا إله إلا الله وأن محمداً رسول الله، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت إن استطعت إليه سبيلاً». قال: صدقت. فعجبنا له يسأله ويصدقه! قال: فأخبرني عن الإيمان. قال: «أن تؤمن بالله وملائكته وكتبه ورسله واليوم الآخر، وتؤمن بالقدر خيره وشره». قال: صدقت. قال: فأخبرني عن الإحسان. قال: «أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك». قال: فأخبرني عن الساعة. قال: «ما المسؤول عنها بأعلم من السائل». قال: فأخبرني عن أماراتها. قال: «أن تلد الأمة ربتها، وأن ترى الحفاة العراة العالة رعاء الشاء يتطاولون في البنيان». ثم انطلق، فلبثت ملياً، ثم قال: «يا عمر، أتدري من السائل؟» قلت: الله ورسوله أعلم. قال: «فإنه جبريل أتاكم يعلمكم دينكم».", source: "رواه مسلم" },
    { text: "عن أبي عبد الرحمن عبد الله بن مسعود رضي الله عنه قال: حدثنا رسول الله ﷺ وهو الصادق المصدوق: «إن أحدكم يجمع خلقه في بطن أمه أربعين يوماً نطفة، ثم يكون علقة مثل ذلك، ثم يكون مضغة مثل ذلك، ثم يرسل إليه الملك فينفخ فيه الروح، ويؤمر بأربع كلمات: بكتب رزقه، وأجله، وعمله، وشقي أو سعيد. فوالله الذي لا إله غيره، إن أحدكم ليعمل بعمل أهل الجنة حتى ما يكون بينه وبينها إلا ذراع، فيسبق عليه الكتاب فيعمل بعمل أهل النار فيدخلها، وإن أحدكم ليعمل بعمل أهل النار حتى ما يكون بينه وبينها إلا ذراع، فيسبق عليه الكتاب فيعمل بعمل أهل الجنة فيدخلها».", source: "رواه البخاري ومسلم" },
    { text: "عن أبي عبد الله النعمان بن بشير رضي الله عنهما قال: سمعت رسول الله ﷺ يقول: «إن الحلال بيّن وإن الحرام بيّن، وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات فقد استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام، كالراعي يرعى حول الحمى يوشك أن يرتع فيه. ألا وإن لكل ملك حمى، ألا وإن حمى الله محارمه. ألا وإن في الجسد مضغة، إذا صلحت صلح الجسد كله، وإذا فسدت فسد الجسد كله، ألا وهي القلب».", source: "رواه البخاري ومسلم" },
    { text: "عن أبي ذر الغفاري رضي الله عنه، عن النبي ﷺ فيما يرويه عن ربه عز وجل أنه قال: «يا عبادي إني حرمت الظلم على نفسي، وجعلته بينكم محرماً فلا تظالموا. يا عبادي كلكم ضال إلا من هديته، فاستهدوني أهدكم. يا عبادي كلكم جائع إلا من أطعمته، فاستطعموني أطعمكم. يا عبادي كلكم عار إلا من كسوته، فاستكسوني أكسكم. يا عبادي إنكم تخطئون بالليل والنهار، وأنا أغفر الذنوب جميعاً، فاستغفروني أغفر لكم. يا عبادي إنكم لن تبلغوا ضري فتضروني، ولن تبلغوا نفعي فتنفعوني. يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئاً. يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد منكم ما نقص ذلك من ملكي شيئاً. يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم قاموا في صعيد واحد فسألوني فأعطيت كل إنسان مسألته ما نقص ذلك مما عندي إلا كما ينقص المخيط إذا أدخل البحر. يا عبادي إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها، فمن وجد خيراً فليحمد الله، ومن وجد غير ذلك فلا يلومن إلا نفسه».", source: "رواه مسلم" },
    { text: "عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال: «سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق في المساجد، ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه، ورجل دعته امرأة ذات منصب وجمال فقال إني أخاف الله، ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه، ورجل ذكر الله خالياً ففاضت عيناه».", source: "رواه البخاري ومسلم" },
    { text: "عن عبد الله بن عمر رضي الله عنهما قال: سمعت رسول الله ﷺ يقول: «انطلق ثلاثة رهط ممن كان قبلكم حتى أووا المبيت إلى غار فدخلوه، فانحدرت صخرة من الجبل فسدت عليهم الغار، فقالوا: إنه لا ينجيكم من هذه الصخرة إلا أن تدعوا الله بصالح أعمالكم. فقال رجل منهم: اللهم كان لي أبوان شيخان كبيران، وكنت لا أغبق قبلهما أهلاً ولا مالاً، فنأى بي في طلب شيء يوماً، فلم أرح عليهما حتى ناما، فحلبت لهما غبوقهما فوجدتهما نائمين، وكرهت أن أغبق قبلهما أهلاً أو مالاً، فلبثت والقدح على يدي أنتظر استيقاظهما حتى برق الفجر، فاستيقظا فشربا غبوقهما، اللهم إن كنت فعلت ذلك ابتغاء وجهك ففرج عنا ما نحن فيه من هذه الصخرة، فانفرجت شيئاً لا يستطيعون الخروج. وقال الآخر: اللهم كانت لي بنت عم كانت أحب الناس إلي، فأردتها عن نفسها فامتنعت مني حتى ألمت بها سنة من السنين، فجاءتني فأعطيتها عشرين ومائة دينار على أن تخلي بيني وبين نفسها، ففعلت حتى إذا قدرت عليها قالت: لا أحل لك أن تفض الخاتم إلا بحقه، فتحرجت من الوقوع عليها، فانصرفت عنها وهي أحب الناس إلي، وتركت الذهب الذي أعطيتها، اللهم إن كنت فعلت ذلك ابتغاء وجهك فافرج عنا ما نحن فيه، فانفرجت الصخرة غير أنهم لا يستطيعون الخروج منها. وقال الثالث: اللهم استأجرت أجراء فأعطيتهم أجرهم غير رجل واحد ترك الذي له وذهب، فثمرت أجره حتى كثرت منه الأموال، فجاءني بعد حين فقال: يا عبد الله أد إلي أجري، فقلت له: كل ما ترى من أجرك من الإبل والبقر والغنم والرقيق، فقال: يا عبد الله لا تستهزئ بي، فقلت: إني لا أستهزئ بك، فأخذه كله فاستاقه فلم يترك منه شيئاً، اللهم فإن كنت فعلت ذلك ابتغاء وجهك فافرج عنا ما نحن فيه، فانفرجت الصخرة فخرجوا يمشون».", source: "رواه البخاري ومسلم" },
    { text: "عن أبي سعيد الخدري رضي الله عنه أن نبي الله ﷺ قال: «كان فيمن كان قبلكم رجل قتل تسعة وتسعين نفساً، فسأل عن أعلم أهل الأرض فُدُلَّ على راهب، فأتاه فقال: إنه قتل تسعة وتسعين نفساً فهل له من توبة؟ فقال: لا، فقتله فكمل به مائة. ثم سأل عن أعلم أهل الأرض فُدُلَّ على رجل عالم، فقال: إنه قتل مائة نفس فهل له من توبة؟ فقال: نعم، ومن يحول بينه وبين التوبة؟ انطلق إلى أرض كذا وكذا، فإن بها أناساً يعبدون الله فاعبد الله معهم، ولا ترجع إلى أرضك فإنها أرض سوء. فانطلق حتى إذا نصف الطريق أتاه الموت، فاختصمت فيه ملائكة الرحمة وملائكة العذاب، فقالت ملائكة الرحمة: جاء تائباً مقبلاً بقلبه إلى الله، وقالت ملائكة العذاب: إنه لم يعمل خيراً قط. فأتاهم مَلَكٌ في صورة آدمي فجعلوه بينهم، فقال: قيسوا ما بين الأرضين، فإلى أيتهما كان أدنى فهو له. فقاسوه فوجدوه أدنى إلى الأرض التي أراد، فقبضته ملائكة الرحمة».", source: "رواه البخاري ومسلم" },
    { text: "عن أبي هريرة رضي الله عنه أنه سمع رسول الله ﷺ يقول: «إن ثلاثة في بني إسرائيل: أبرص وأقرع وأعمى، بدا لله عز وجل أن يبتليهم، فبعث إليهم ملكاً، فأتى الأبرص فقال: أي شيء أحب إليك؟ قال: لون حسن، وجلد حسن، ويذهب عني الذي قد قذرني الناس. فمسحه فذهب عنه قذره، وأعطي لوناً حسناً. قال: فأي المال أحب إليك؟ قال: الإبل، فأعطي ناقة عشراء، فقال: بارك الله لك فيها. فأتى الأقرع فقال: أي شيء أحب إليك؟ قال: شعر حسن، ويذهب عني هذا الذي قذرني الناس. فمسحه فذهب عنه، وأعطي شعراً حسناً. قال: فأي المال أحب إليك؟ قال: البقر، فأعطي بقرة حاملاً، فقال: بارك الله لك فيها. فأتى الأعمى فقال: أي شيء أحب إليك؟ قال: أن يرد الله إلي بصري فأبصر به الناس. فمسحه فرد الله إليه بصره. قال: فأي المال أحب إليك؟ قال: الغنم، فأعطي شاة والداً. فأنتج هذان وولد هذا، فكان لهذا واد من الإبل، ولهذا واد من البقر، ولهذا واد من الغنم. ثم إنه أتى الأبرص في صورته وهيئته فقال: رجل مسكين قد انقطعت بي الحبال في سفري، فلا بلاغ لي اليوم إلا بالله ثم بك، أسألك بالذي أعطاك اللون الحسن والجلد الحسن والمال، بعيراً أتبلغ به في سفري. فقال: الحقوق كثيرة. فقال له: كأني أعرفك، ألم تكن أبرص يقذرك الناس فقيراً فأعطاك الله؟ فقال: إنما ورثت هذا المال كابراً عن كابر. فقال: إن كنت كاذباً فصيرك الله إلى ما كنت. وأتى الأقرع فقال له مثل ما قال للأبرص، ورد عليه مثل ما رد عليه الأبرص، فقال: إن كنت كاذباً فصيرك الله إلى ما كنت. وأتى الأعمى فقال: رجل مسكين وابن سبيل انقطعت بي الحبال في سفري، فلا بلاغ لي اليوم إلا بالله ثم بك، أسألك بالذي رد عليك بصرك شاة أتبلغ بها في سفري. فقال: قد كنت أعمى فرد الله إلي بصري، فخذ ما شئت ودع ما شئت، فوالله لا أجهدك اليوم شيئاً أخذته لله. فقال: أمسك مالك، فإنما ابتليتم، فقد رضي عنك، وسخط على صاحبيك».", source: "رواه البخاري ومسلم" },
    { text: "عن العباس بن عبد المطلب رضي الله عنه أنه سمع رسول الله ﷺ يقول: «ذاق طعم الإيمان من رضي بالله رباً، وبالإسلام ديناً، وبمحمد رسولاً». وعن أبي محمد عبد الله بن عمرو بن العاص رضي الله عنهما قال: قال رسول الله ﷺ: «لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به».", source: "رواه مسلم / وحديث لا يؤمن أحدكم صححه النووي" },
    { text: "عن أبي العباس عبد الله بن عباس رضي الله عنهما قال: كنت خلف النبي ﷺ يوماً، فقال: «يا غلام، إني أعلمك كلمات: احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله، واعلم أن الأمة لو اجتمعت على أن ينفعوك بشيء لم ينفعوك إلا بشيء قد كتبه الله لك، وإن اجتمعوا على أن يضروك بشيء لم يضروك إلا بشيء قد كتبه الله عليك، رفعت الأقلام وجفت الصحف».", source: "رواه الترمذي وقال: حسن صحيح" },
    { text: "عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «إن الله تعالى قال: من عادى لي ولياً فقد آذنته بالحرب، وما تقرب إلي عبدي بشيء أحب إلي مما افترضته عليه، ولا يزال عبدي يتقرب إلي بالنوافل حتى أحبه، فإذا أحببته كنت سمعه الذي يسمع به، وبصره الذي يبصر به، ويده التي يبطش بها، ورجله التي يمشي بها، ولئن سألني لأعطينه، ولئن استعاذني لأعيذنه».", source: "رواه البخاري" },
    { text: "عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «أتدرون ما المفلس؟» قالوا: المفلس فينا من لا درهم له ولا متاع. فقال: «إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة، ويأتي قد شتم هذا، وقذف هذا، وأكل مال هذا، وسفك دم هذا، وضرب هذا، فيعطى هذا من حسناته، وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أُخذ من خطاياهم فطرحت عليه ثم طرح في النار».", source: "رواه مسلم" },
    { text: "عن عبد الله بن مسعود رضي الله عنه قال: قال رسول الله ﷺ: «إني لأعلم آخر أهل النار خروجاً منها، وآخر أهل الجنة دخولاً الجنة، رجل يخرج من النار حبواً، فيقول الله تبارك وتعالى له: اذهب فادخل الجنة، فيأتيها فيخيل إليه أنها ملأى، فيرجع فيقول: يا رب وجدتها ملأى، فيقول الله تبارك وتعالى له: اذهب فادخل الجنة، فيأتيها فيخيل إليه أنها ملأى، فيرجع فيقول: يا رب وجدتها ملأى، فيقول الله له: اذهب فادخل الجنة، فإن لك مثل الدنيا وعشرة أمثالها، أو إن لك عشرة أمثال الدنيا. فيقول: أتسخر بي أو تضحك بي وأنت الملك؟» قال: فلقد رأيت رسول الله ﷺ ضحك حتى بدت نواجذه، فكان يقال: ذاك أدنى أهل الجنة منزلة.", source: "رواه البخاري ومسلم" },
    { text: "عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله ﷺ: «يُجاء بالموت يوم القيامة كأنه كبش أملح، فيوقف بين الجنة والنار، فيقال: يا أهل الجنة هل تعرفون هذا؟ فيشرئبون وينظرون ويقولون: نعم، هذا الموت. قال: ويقال: يا أهل النار هل تعرفون هذا؟ فيشرئبون وينظرون ويقولون: نعم، هذا الموت. قال: فيؤمر به فيذبح، ثم يقال: يا أهل الجنة خلود فلا موت، ويا أهل النار خلود فلا موت». ثم قرأ رسول الله ﷺ: {وأنذرهم يوم الحسرة إذ قضي الأمر وهم في غفلة وهم لا يؤمنون}.", source: "رواه البخاري ومسلم" },
    { text: "عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «احتجت الجنة والنار، فقالت النار: أوثرت بالمتكبرين والمتجبرين، وقالت الجنة: ما لي لا يدخلني إلا ضعفاء الناس وسقطهم. قال الله تبارك وتعالى للجنة: أنت رحمتي أرحم بك من أشاء من عبادي، وقال للنار: إنما أنت عذابي أعذب بك من أشاء من عبادي، ولكل واحدة منكما ملؤها. فأما النار فلا تمتلئ حتى يضع رجله فتقول: قط قط قط، فهنالك تمتلئ ويزوى بعضها إلى بعض، ولا يظلم الله عز وجل من خلقه أحداً، وأما الجنة فإن الله عز وجل ينشئ لها خلقاً».", source: "رواه البخاري ومسلم" },
    { text: "عن أبي مالك الحارث بن عاصم الأشعري رضي الله عنه قال: قال رسول الله ﷺ: «الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن أو تملأ ما بين السماوات والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك، كل الناس يغدو، فبائع نفسه فمعتقها أو موبقها».", source: "رواه مسلم" },
    { text: "عن معاذ بن جبل رضي الله عنه قال: كنت ردف النبي ﷺ على حمار يقال له عفير، فقال: «يا معاذ، هل تدري حق الله على عباده، وما حق العباد على الله؟» قلت: الله ورسوله أعلم. قال: «فإن حق الله على العباد أن يعبدوه ولا يشركوا به شيئاً، وحق العباد على الله أن لا يعذب من لا يشرك به شيئاً». فقلت: يا رسول الله أفلا أبشر به الناس؟ قال: «لا تبشرهم فيتكلوا».", source: "رواه البخاري ومسلم" },
    { text: "عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «إن لله ملائكة يطوفون في الطرق يلتمسون أهل الذكر، فإذا وجدوا قوماً يذكرون الله تنادوا: هلموا إلى حاجتكم. قال: فيحفونهم بأجنحتهم إلى السماء الدنيا. قال: فيسألهم ربهم عز وجل وهو أعلم بهم: ما يقول عبادي؟ قال: يقولون: يسبحونك ويكبرونك ويحمدونك ويمجدونك. قال: فيقول: هل رأوني؟ قال: فيقولون: لا والله ما رأوك. قال: فيقول: وكيف لو رأوني؟ قال: يقولون: لو رأوك كانوا أشد لك عبادة، وأشد لك تمجيداً وتحميداً، وأكثر لك تسبيحاً. قال: يقول: فما يسألوني؟ قال: يسألونك الجنة. قال: يقول: وهل رأوها؟ قال: يقولون: لا والله يا رب ما رأوها. قال: يقول: فكيف لو أنهم رأوها؟ قال: يقولون: لو أنهم رأوها كانوا أشد عليها حرصاً، وأشد لها طلباً، وأعظم فيها رغبة. قال: فمم يتعوذون؟ قال: يقولون: من النار. قال: يقول: وهل رأوها؟ قال: يقولون: لا والله يا رب ما رأوها. قال: يقول: فكيف لو رأوها؟ قال: يقولون: لو رأوها كانوا أشد منها فراراً، وأشد لها مخافة. قال: فيقول: فأشهدكم أني قد غفرت لهم. قال: يقول ملك من الملائكة: فيهم فلان ليس منهم، إنما جاء لحاجة. قال: هم الجلساء لا يشقى بهم جليسهم».", source: "رواه البخاري ومسلم" },
    { text: "عن النعمان بن بشير رضي الله عنهما، عن النبي ﷺ قال: «مَثَلُ القائم على حدود الله والواقع فيها، كمثل قوم استهموا على سفينة، فأصاب بعضهم أعلاها وبعضهم أسفلها، فكان الذين في أسفلها إذا استقوا من الماء مروا على من فوقهم، فقالوا: لو أنا خرقنا في نصيبنا خرقاً ولم نؤذ من فوقنا، فإن يتركوهم وما أرادوا هلكوا جميعاً، وإن أخذوا على أيديهم نجوا ونجوا جميعاً».", source: "رواه البخاري" }
  ];

  const list = document.getElementById('hadithList');
  
  ahadith.forEach((h, i) => {
    // تجهيز النص لمنع تعارض علامات التنصيص
    const cleanText = h.text.replace(/"/g, '&quot;').replace(/'/g, "\\'");
    
    list.innerHTML += `
      <div class="hadith-card">
        <div class="hadith-text">${i + 1}. ${h.text}</div>
        <div class="hadith-footer">
          <span class="hadith-source">${h.source}</span>
          <button class="play-btn" onclick="speakText('${cleanText}', this)">🔊 استمع للحديث</button>
        </div>
      </div>`;
  });

  let activeBtn = null;

  function speakText(text, btn) {
    if ('speechSynthesis' in window) {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        if (activeBtn === btn) {
          btn.innerHTML = '🔊 استمع للحديث';
          btn.classList.remove('playing');
          activeBtn = null;
          return;
        }
      }

      if (activeBtn) {
        activeBtn.innerHTML = '🔊 استمع للحديث';
        activeBtn.classList.remove('playing');
      }

      const cleanString = text.replace(/&quot;/g, '"');
      const msg = new SpeechSynthesisUtterance(cleanString);
      msg.lang = 'ar-SA';
      msg.rate = 0.85; 

      msg.onstart = () => {
        btn.innerHTML = '⏹ إيقاف الاستماع';
        btn.classList.add('playing');
        activeBtn = btn;
      };

      msg.onend = () => {
        btn.innerHTML = '🔊 استمع للحديث';
        btn.classList.remove('playing');
        activeBtn = null;
      };

      window.speechSynthesis.speak(msg);
    } else {
      alert('عفواً، متصفحك لا يدعم خاصية القراءة الصوتية.');
    }
  }
</script>
